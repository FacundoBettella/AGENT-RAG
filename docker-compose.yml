name: agent-rag

services:
  dev:
    build:
      context: .
      # Dockerfile.dev = production deps + pytest/ruff/mypy, so the eynstein
      # harness (profiles/active/test.sh) can run the suite inside this service
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    working_dir: /app
    # whole repo mounted: the harness runs profiles/active/test.sh from /app,
    # and it still covers src/, data/, scripts/, test_queries.json and keeps
    # .chroma/ and logs/ persisted across `docker compose down`
    volumes:
      - .:/app
