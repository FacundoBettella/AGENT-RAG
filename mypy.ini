[mypy]
# Los módulos se importan con src/ como raíz (agents, api, domain, ...).
mypy_path = src
explicit_package_bases = True
files = src, scripts
ignore_missing_imports = True

# Librerías pesadas: analizarlas hace que mypy tarde minutos. Se tratan como Any.
[mypy-langchain_chroma.*,langchain_community.*,langchain_core.*,langchain_openai.*,langchain_text_splitters.*,langfuse.*,faiss.*,chromadb.*]
follow_imports = skip
